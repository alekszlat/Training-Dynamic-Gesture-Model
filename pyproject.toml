[project]
name = "training-dynamic-gesture-model"
version = "0.1.0"
description = "Training mode for dynamic gesture recognition"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.0",
    "mediapipe>=0.10.35",
    "numpy>=2.5.0",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    "torch>=2.12.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "mypy>=1.19.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.mypy.overrides]]
module = "mediapipe.*"
ignore_missing_imports = true
