[project]
name = "training-dynamic-gesture-model"
version = "0.1.0"
description = "Training mode for dynamic gesture recognition"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.0",
    "mediapipe>=0.10.35",
    "numpy>=2.5.0",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    "torch>=2.12.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "mypy>=1.19.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "pytest-randomly>=3.16.0",
]

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.mypy.overrides]]
module = ["mediapipe.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# C3/F5: the repo root holds config.py, which tests/ imports. Declaring it here
# keeps the tests from mutating sys.path at import time (leaked global state).
pythonpath = ["."]

# Quarantine for a test found to be order-dependent. Mark it rather than delete
# it: the test still describes real behaviour, and deleting it loses that while
# leaving the underlying leak in place. The CI gate skips these, a second
# non-blocking job keeps running them, so a quarantined test stays visible
# without holding up merges. Unmark it once the polluter has a teardown or the
# brittle test owns its setup.
markers = [
    "flaky: order-dependent, quarantined out of the CI gate until fixed",
]

# A mistyped marker silently does nothing without this.
addopts = "--strict-markers"
